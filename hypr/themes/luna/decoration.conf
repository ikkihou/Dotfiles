source = ./colors.conf

general {
    border_size = 2
    col.inactive_border = rgba($lavenderAlpha69)
    col.active_border = rgba($textAlphaee) rgba($lavenderAlpha69) rgba($lavenderAlpha69) rgba($textAlphaee) 45deg

    gaps_in = 3
    gaps_out = 6
}

decoration {
    rounding = 7

    active_opacity = 0.85
    inactive_opacity = 0.8

    blur {
        enabled = yes
        size = 5
        passes = 4
        ignore_opacity = true
        new_optimizations = true
        xray = true
        noise = 0.0
        popups = true
    }

    dim_inactive = true
    dim_strength = 0.1
    
    shadow {
        range = 20
        render_power = 5
        color = $crust
        color_inactive = $surface0
    }
    # drop_shadow = yes
    # shadow_range = 40
    # shadow_scale = 2
    # shadow_render_power = 5
    # col.shadow = $crust
    # col.shadow_inactive = $surface0
}

group {
    col.border_inactive = rgba($lavenderAlpha69)
    col.border_active = rgba($textAlphaee) rgba($lavenderAlpha69) rgba($lavenderAlpha69) rgba($textAlphaee) 45deg

    groupbar {
      col.active = rgba($lavenderAlphaCC)
      col.inactive = rgba($subtext1Alpha99)
      font_family = JetBrainsMono Nerd Font
      font_size = 10
      text_color = rgb($baseAlpha)
    }
}
